<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ADHD Reader</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/48.png" alt="" width="32" height="32"><div><h1>ADHD Reader</h1><p>Focus &amp; Speed Reading</p></div></header>
  <main>
    <label class="toggle"><span>Global enable</span><input id="enabled" type="checkbox" disabled></label>
    <label class="toggle"><span>Enable on this site</span><input id="site" type="checkbox" disabled></label>
    <p id="hostname">Checking this page…</p>
    <label class="slider" for="ratio">Bold ratio <output id="ratio-value"></output></label>
    <input id="ratio" type="range" min="0.2" max="0.7" step="0.01" value="0.45" disabled>
    <label class="slider" for="weight">Bold weight <output id="weight-value"></output></label>
    <input id="weight" type="range" min="500" max="900" step="100" value="700" disabled>
    <label class="slider" for="opacity">Rest-of-word opacity <output id="opacity-value"></output></label>
    <input id="opacity" type="range" min="0.4" max="1" step="0.05" value="1" disabled>
    <p class="hint">Changes apply live. Site preferences are saved even while globally paused.</p>
    <p class="hint">Site shortcut: Alt+Shift+R</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main><script src="popup.js"></script>
</body>
</html>
